# Change log configuration for git-cliff (https://git-cliff.org)
[changelog]
header = "# Change log\n"
body = """
{% if version %}## {{ version | trim_start_matches(pat="v") }} — {{ timestamp | date(format="%Y-%m-%d") }}{% else %}## Unreleased{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}{% if commit.breaking %} *(affects scoring)*{% endif %} ({{ commit.id | truncate(length=7, end="") }})
{% endfor %}{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_parsers = [
  { message = "^feat", group = "<!-- 1 -->Criteria added" },
  { message = "^retire", group = "<!-- 2 -->Criteria retired, moved or merged" },
  { message = "^policy", group = "<!-- 3 -->Policy (thresholds, weights, critical flags)" },
  { message = "^fix", group = "<!-- 4 -->Corrections" },
  { message = "^docs", group = "<!-- 5 -->Text and guides" },
  { message = "^(chore|ci|build|refactor|test)", group = "<!-- 6 -->Repository and tooling" },
  { message = ".*", group = "<!-- 7 -->Other" },
]
protect_breaking_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
