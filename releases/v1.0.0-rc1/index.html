<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Testing Criteria Scorecard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div>
        <h1>HIE System Validation — Testing Criteria Scorecard</h1>
        <p class="sub">Web version of the scorecard workbook. Answers stay in this browser; save them to a file to keep or share.</p>
      </div>
      <div class="actions">
        <button id="btn-save" type="button">Save evaluation</button>
        <label class="button" for="file-load">Load evaluation</label>
        <input id="file-load" type="file" accept="application/json,.json" hidden>
        <button id="btn-print" type="button">Print report</button>
        <button id="btn-reset" type="button" class="danger">Clear answers</button>
      </div>
    </div>
    <div id="banner" class="banner" role="status"></div>
    <nav id="tabs" class="tabs" aria-label="Sheets"></nav>
  </header>
  <main id="main" tabindex="-1"><p class="loading">Loading criteria…</p></main>
  <footer class="foot" id="foot"></footer>
  <script src="scoring.js"></script>
  <script src="app.js"></script>
</body>
</html>
