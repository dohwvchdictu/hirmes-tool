<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="build" content="35e735ecc4a2">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Testing Criteria Scorecard</title>
  <link rel="stylesheet" href="style.css?v=35e735ecc4a2">
</head>
<body>
  <header class="top" id="top">
    <div class="top-inner">
      <button id="nav-toggle" class="nav-toggle" type="button" aria-expanded="false" aria-controls="side" aria-label="Open navigation">
        <span class="burger" aria-hidden="true"></span><span id="nav-cur" class="nav-cur">Summary</span>
      </button>
      <a class="brand" href="#summary" title="Summary">
        <h1>Healthcare Interoperability Readiness Matrix for EMR Systems Evaluation Tool</h1>
        <span class="sub">HIE System Validation — Testing Criteria Scorecard</span>
      </a>
      <div class="search" role="search">
        <svg class="s-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4.2-4.2"/></svg>
        <input id="q" type="search" placeholder="Search criteria, terms, registers, documents" aria-label="Search criteria, terms, registers and documents" autocomplete="off">
        <kbd class="s-key" title="Press / to search">/</kbd>
        <div id="q-list" class="q-list" role="listbox" hidden></div>
      </div>
      <div class="menu">
        <button id="menu-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="menu-list">Evaluation <span aria-hidden="true">▾</span></button>
        <div id="menu-list" class="menu-list" role="menu" hidden>
          <div class="menu-h">This evaluation</div>
          <button id="btn-save" type="button" role="menuitem"><b>Save evaluation</b><span>Download answers, notes and profile (.json)</span></button>
          <label class="button" for="file-load" role="menuitem"><b>Load evaluation…</b><span>Continue from a saved .json file</span></label>
          <input id="file-load" type="file" accept="application/json,.json" hidden>
          <button id="btn-print" type="button" role="menuitem"><b>Print report</b><span>Printed evaluation report / PDF</span></button>
          <button id="btn-print-cert-menu" type="button" role="menuitem"><b>Print certificate</b><span>Certificate of validation, A4 / PDF (proof of concept)</span></button>
          <button id="btn-reset" type="button" role="menuitem" class="danger"><b>Clear answers</b><span>Remove everything saved in this browser</span></button>
          <div class="menu-h">Excel workbook</div>
          <a id="dl-blank" class="button" role="menuitem" href="#" download><b>Blank workbook (.xlsx)</b><span id="dl-blank-note">Scorecard workbook of this version, to fill in offline</span></a>
          <button id="dl-filled" type="button" role="menuitem" aria-disabled="true" class="soon"><b>Workbook with my answers (.xlsx) <i class="soon-tag">Coming soon</i></b><span>Not available yet. Meanwhile use Save evaluation, or copy the results into the blank workbook.</span></button>
        </div>
      </div>
    </div>
    <div id="banner" class="banner" role="status"></div>
  </header>
  <aside id="side" class="side" aria-label="Navigation"><nav id="tabs" class="tabs" aria-label="Sections"></nav></aside>
  <div id="scrim" class="scrim" hidden></div>
  <main id="main" tabindex="-1"><p class="loading">Loading criteria…</p></main>
  <footer class="foot" id="foot"></footer>
  <script src="scoring.js?v=35e735ecc4a2"></script>
  <script src="reference.js?v=35e735ecc4a2"></script>
  <script src="cert.js?v=35e735ecc4a2"></script>
  <script src="app.js?v=35e735ecc4a2"></script>
</body>
</html>
