id: TEC-05
status: active
section: Security
title: Automatic log-out after inactivity
critical: 'no'
weight: 1
scoring: binary
validation_role: Validator + server-side check + Observer
evidence: Screenshot / configuration
developer_guide: |
  Log the user out, or lock the session and require re-authentication, after an idle period that the facility can configure. The default MUST NOT exceed the TB-06 value.

  Purpose: Unattended screens do not expose patient data.
validator_guide: Check the configured idle period (default as TB-06 specifies). Then leave a session idle for that time. Met if the user is logged out, or the session is locked and requires re-authentication.
