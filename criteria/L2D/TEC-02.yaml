id: TEC-02
status: active
section: Security
title: Each user has a unique account (no shared logins)
critical: 'yes'
weight: 2
scoring: binary
validation_role: Validator + server-side check + Observer
evidence: User account list
developer_guide: |
  Require one account per user. Do not use generic or shared accounts. Protect accounts as TB-05 specifies (minimum password length, lock-out or throttling after failed attempts, no default passwords). The vendor MAY use any identity method (local accounts, LDAP / Active Directory, single sign-on, OpenID Connect).

  Purpose: Every action can be traced to a person.
validator_guide: Check that the system requires a unique account for each user. Check that no generic or shared accounts are used for test referrals. Then try (a) a password shorter than the TB-05 minimum and (b) repeated failed log-ins. Met only if all three behave as TB-05 requires.
