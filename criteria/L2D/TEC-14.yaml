id: TEC-14
status: active
section: Vulnerability assessment
title: An independent vulnerability assessment (VAPT or authenticated scan) of the version under test exists, with no unresolved critical / high findings
critical: 'no'
weight: 1
scoring: binary
validation_role: Validator + Technical Lead
evidence: VAPT / scan executive summary + signed attestation (or full report, view-only)
developer_guide: |
  Provide evidence of a security assessment of the version under test (or the same major version). The assessment is a vulnerability assessment and penetration test, or an authenticated vulnerability scan. An independent party or a separate security team did it within the last 12 months (TB-14). Critical / high findings are fixed or covered by a remediation plan that the Technical Lead accepts. Evidence options are as Instructions 4B specifies (for example, executive summary + signed attestation).

  Purpose: Black-box conformance testing cannot replace a security assessment. This criterion checks that one was done.
validator_guide: Check the date, the scope (product + version), the independence of the assessor and the status of critical / high findings. Met only if all four are acceptable. This criterion does not make this validation a security assessment (see the disclaimer above).
