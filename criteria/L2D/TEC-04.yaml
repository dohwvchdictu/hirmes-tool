scoring: count
validation_role: Validator + server-side check + Observer
evidence: Audit log extract
developer_guide: |
  Log user, date/time and action for these events: create, view, edit, send, receive, accept, decline, print, export and log-in. Include the fields that TB-08 requires. The vendor MAY choose the storage format (database table, log file, FHIR AuditEvent, SIEM).

  Purpose: The audit trail is necessary for accountability and privacy compliance.
validator_guide: |
  Do the 10 actions listed in the Notes (create, view, edit, send, receive, accept, decline, print, export, log-in). Count the actions that the audit log shows with user and time.
  Mark each sub-item (↳) below. The tool counts Achieved automatically.
