# Register of issued certificates. The Verify page (and the QR code on each certificate) answers
# from this file, so a certificate counts as issued only once its entry is committed here.
#
# Record:     paste the entry shown on Output › Certificate (commit: "cert: record <number>").
# Revoke:     set status: revoked and add reason (commit: "cert: revoke <number> (<reference>)").
# Supersede:  record the new certificate with supersedes: <old number>; the old one then shows as
#             superseded. Never delete or edit the details of an entry: the fingerprint is computed
#             from them, and scripts/check.py fails when they no longer match.
#
# Fields: number, issued, expires, vendor, category, product, version, ph_core, pheref, level,
# criteria, signatory, signatory_name, fingerprint, status (valid | revoked), supersedes, reason.
