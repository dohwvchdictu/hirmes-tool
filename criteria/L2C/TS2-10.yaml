id: TS2-10
status: active
section: Receiving practitioner
title: Receiving practitioner / care navigator is assigned and kept separate from the referring practitioner
critical: subs
weight: 2
scoring: count
validation_role: Validator + server-side check + Observer
evidence: Screenshot of receiving EMR + server-side evidence / resource ID
developer_guide: |
  Read the receiving PractitionerRole referenced by Task.owner (and ServiceRequest.performer) from the SHR. Show the data in the receiving view exactly as sent, with no re-typing. The vendor MAY choose the screen layout and labels. The value and its meaning MUST match.

  Purpose: Referring and receiving practitioners use the same resource types. The system MUST keep them as different people (intended behaviour).
validator_guide: |
  1. Open the received Test Data referral in the receiving EMR.
  2. Compare each sub-item on screen with the Test Data value. Write what you see in Test Data column D.
  3. Use the server-side evidence to confirm that the EMR read the value from the SHR (not from manual entry).
  4. Assign the receiving practitioner / care navigator in the receiving EMR.
  5. Confirm Task.owner on the SHR. Confirm that both practitioners appear separately on screen.
  Mark each sub-item (↳) below. The tool counts Achieved automatically. ★ = critical sub-item. If a ★ sub-item is Not Met (or N/A), the criterion counts as a critical failure.
  Server-side evidence is any one of these items:
  (a) The Interoperability Layer transaction log (for example, OpenHIM).
  (b) An Inferno / official FHIR validator report.
  (c) The raw FHIR request / response payload that the developer provides and that is captured during the session.
sub_items:
- id: TS2-10.1
  text: Name of receiving practitioner
  critical: false
- id: TS2-10.2
  text: 'Care navigator at the receiving facility: Task.owner (N/A if the facility does not assign one)'
  critical: false
- id: TS2-10.3
  text: Practitioner role (receiving)
  critical: true
- id: TS2-10.4
  text: Referring and receiving practitioners are stored and shown as separate people, not merged or overwritten
  critical: true
