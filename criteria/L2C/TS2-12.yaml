id: TS2-12
status: active
section: Referral status
title: Status changes made by the receiving facility are shown at the referring facility
critical: 'yes'
weight: 2
scoring: binary
validation_role: Validator + server-side check + Observer
evidence: Screenshot at referring EMR + server-side evidence
developer_guide: |
  Read the updated Task from the SHR. The vendor MAY choose polling, subscription or IOL notification. Show the current status to the referring facility.

  Purpose: The referring facility knows whether the patient is expected.
validator_guide: |
  Change the status at the receiving EMR (TS2-11). Met if the referring EMR shows the new status, including a rejection and its reason.
  Server-side evidence is any one of these items:
  (a) The Interoperability Layer transaction log (for example, OpenHIM).
  (b) An Inferno / official FHIR validator report.
  (c) The raw FHIR request / response payload that the developer provides and that is captured during the session.
