id: TS2-13
status: active
section: Status history
title: 'Every status change of the referral is time-stamped and kept: requested, received, accepted / rejected, completed (moved from L4-06, Connectathon Issue #26)'
critical: 'yes'
weight: 2
scoring: count
validation_role: Validator (server-side check)
evidence: Task history / Provenance from the SHR
developer_guide: |
  Record the date/time of each Task status change so that it is possible to read the history later. The vendor MAY use Task history / versions, Provenance, or Task.lastModified per update. ERefTask marks authoredOn and lastModified as Must Support. Earlier timestamps MUST NOT be overwritten.

  Purpose: The history is necessary for audit and for turnaround time (IND-08).
validator_guide: |
  After TS2-11, the validator (server-side) reads the Task history (_history) or the linked Provenance on the SHR. Count the 4 status changes that have a date/time that matches when they were made.
  Mark each sub-item (↳) below. The tool counts Achieved automatically. ★ = critical sub-item. If a ★ sub-item is Not Met (or N/A), the criterion counts as a critical failure.
  Server-side evidence is any one of these items:
  (a) The Interoperability Layer transaction log (for example, OpenHIM).
  (b) An Inferno / official FHIR validator report.
  (c) The raw FHIR request / response payload that the developer provides and that is captured during the session.
