id: TS2-05
status: active
section: Referral request
title: Referral request details are retrieved and shown correctly
critical: subs
weight: 2
scoring: count
validation_role: Validator + server-side check + Observer
evidence: Screenshot of receiving EMR + server-side evidence / resource ID
developer_guide: |
  Read the ServiceRequest from the SHR. Show the data in the receiving view exactly as sent, with no re-typing. The vendor MAY choose the screen layout and labels. The value and its meaning MUST match.

  Purpose: The receiving facility sees what is requested, how urgent it is and why.
validator_guide: |
  1. Open the received Test Data referral in the receiving EMR.
  2. Compare each sub-item on screen with the Test Data value. Write what you see in Test Data column D.
  3. Use the server-side evidence to confirm that the EMR read the value from the SHR (not from manual entry).
  Mark each sub-item (↳) below. The tool counts Achieved automatically. ★ = critical sub-item. If a ★ sub-item is Not Met (or N/A), the criterion counts as a critical failure.
  Server-side evidence is any one of these items:
  (a) The Interoperability Layer transaction log (for example, OpenHIM).
  (b) An Inferno / official FHIR validator report.
  (c) The raw FHIR request / response payload that the developer provides and that is captured during the session.
