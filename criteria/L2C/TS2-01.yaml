id: TS2-01
status: active
section: Retrieval
title: The receiving facility finds new referrals addressed to it without typing a referral / resource ID
critical: 'yes'
weight: 2
scoring: binary
validation_role: Validator + server-side check + Observer
evidence: Screenshot of incoming list + server-side evidence
developer_guide: |
  Search / subscribe for referrals addressed to the facility (e.g., by Task.owner or ServiceRequest.performer = the facility's NHFR-identified Organization). Polling, subscription or IOL notification is the vendor's choice.

  Purpose: Referrals are not missed and staff do not need IDs passed by phone.
validator_guide: |
  Submit the Test Data referral; Met if it appears in the receiving facility's incoming list without typing an ID.
  Server-side evidence — any ONE of: (a) Interoperability Layer transaction log (e.g., OpenHIM), (b) Inferno / official FHIR validator report, or (c) the raw FHIR request / response payload provided by the developer and captured during the session.
