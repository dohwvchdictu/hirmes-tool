id: TS2-01
status: active
section: Retrieval
title: The receiving facility finds new referrals addressed to it without typing a referral / resource ID
critical: 'yes'
weight: 2
scoring: binary
validation_role: Validator + server-side check + Observer
evidence: Screenshot of incoming list + server-side evidence
developer_guide: |
  Search for, or subscribe to, referrals addressed to the facility. For example, use Task.owner or ServiceRequest.performer = the facility's NHFR-identified Organization. The vendor MAY choose polling, subscription or IOL notification.

  Purpose: Staff do not miss referrals and do not need to get IDs by phone.
validator_guide: |
  Submit the Test Data referral. Met if it appears in the receiving facility's incoming list without typing an ID.
  Server-side evidence is any one of these items:
  (a) The Interoperability Layer transaction log (for example, OpenHIM).
  (b) An Inferno / official FHIR validator report.
  (c) The raw FHIR request / response payload that the developer provides and that is captured during the session.
