developer_guide: Provide a field for the DSWD household / beneficiary identifier. Where DSWD has granted API access and a data sharing agreement is in place, the system may look it up or verify it through the DSWD dxCLOUD API (https://dxcloud.dswd.gov.ph/api/documentation — e.g., /api/person/getUBID, /api/person/verifyPantawid). Optional and not scored until the TDG defines the PH Core / PHeReF mapping.
validator_guide: Record whether the field exists and, if DSWD API access was granted, whether a look-up works (for information only).
