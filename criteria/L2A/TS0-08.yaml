developer_guide: |
  Provide a field for the DSWD household / beneficiary identifier. The system MAY query or verify the identifier through the DSWD dxCLOUD API. This applies only where DSWD granted API access and a data sharing agreement is in place. See https://dxcloud.dswd.gov.ph/api/documentation (for example, /api/person/getUBID, /api/person/verifyPantawid). This item is OPTIONAL and is not scored until the TDG defines the PH Core / PHeReF mapping.
validator_guide: |
  Record whether the field exists.
  If DSWD granted API access, record whether a look-up works (for information only).
