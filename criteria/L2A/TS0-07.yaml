id: TS0-07
status: active
section: Registry
title: Patient identifiers (PhilHealth ID and PhilSys number) are captured, validated and sent with the official PH Core identifier system, so that every patient record is linked to them (critical)
critical: 'yes'
weight: 2
scoring: count
validation_role: Validator + server-side check + Observer
evidence: SHR Patient resource + error screenshot for the malformed value
developer_guide: |
  For every patient:
  (1) Provide fields for the PhilHealth ID and the PhilSys number.
  (2) Validate the format per the PH Core IG. Reject malformed values.
  (3) Send each identifier as Patient.identifier with the PH Core identifier system (PHCorePhilHealthID / PHCorePhilSysID).
  (4) Use a verification service where one is made available for the sandbox. Examples: the PhilSys Verifier through the DSWD dxCLOUD API under an agreement with DSWD (SRC-14), or a PhilHealth service (SRC-13).
  If a patient genuinely has no number yet, the system MAY save the record with the reason recorded (for example, "not yet registered"). Then the record can be linked later. The system MUST NOT invent or default a number. The vendor MAY choose how to implement validation.

  Purpose: Patients are expected to be linked to their PhilHealth and PhilSys numbers across the network. These identifiers are the keys for matching records and avoiding duplicates (L4-08).
validator_guide: |
  For each identifier (sub-item):
  1. Enter the Test Data value and submit it.
  2. Validator (server-side): retrieve the Patient. Confirm that identifier.system and value match PH Core and the Test Data.
  3. Enter one malformed value (for example, wrong number of digits, or letters). The system MUST reject it.
  4. If a verification service is available on the sandbox, confirm that the system used it.
  Met only if all applicable steps pass. Critical: both sub-items MUST be Met.
  Mark each sub-item (↳) below. The tool counts Achieved automatically.
sub_items:
