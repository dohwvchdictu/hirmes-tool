- key: L2D
  tab: L2-D System Resilience
  title: Level 2D — Security, Reliability & Exception Handling
  intro: 'Baseline technical safeguards that are REQUIRED before live patient data is exchanged. Each criterion states the outcome tested. The Technical Baseline (Reference Guide, Ch. 3) (TB-01 to TB-14) gives the minimum measurable specification. The vendor MAY use any product, platform or method that meets or exceeds the baseline. The Validator tests outcomes by using the system (black-box). Where documents are necessary, vendors MAY choose any evidence option in Instructions 4B. Vendors never need to give internals or trade secrets. Disclaimer: this is security conformance testing of defined controls. Passing it is not equivalent to passing a vulnerability assessment and penetration test (VAPT) or a full cybersecurity assessment. (TEC-14 only checks that an independent assessment exists.) Exception handling (TS3-01 to TS3-09): the EMR MUST NOT show a failed exchange as successful. The EMR MUST explain the error and allow correction. The EMR MUST leave exactly one correct referral on the SHR. Test Data Section D (TD-D##) gives the inputs and expected results.'
  note: 'Count criteria: mark each sub-item (rows marked ↳). The tool calculates Required, Achieved, Result and Outstanding automatically.'
  report_heading: LEVEL 2D — SECURITY, RELIABILITY & EXCEPTION HANDLING (conformance testing — not a VAPT)
