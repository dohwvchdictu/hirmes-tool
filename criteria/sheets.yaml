- key: L2D
  tab: L2-Security
  title: Level 2D — Security, Reliability & Exception Handling
  intro: 'Baseline technical safeguards required before live patient data is exchanged. Each criterion states the OUTCOME tested; the minimum measurable specification is given in the Technical Baseline (Reference Guide, Ch. 3) (TB-01 to TB-14). Any product, platform or method that meets or exceeds the baseline is acceptable. Outcomes are tested by using the system (black-box); where documents are needed, vendors may choose any evidence option in Instructions 4B — internals and trade secrets are never required. DISCLAIMER: this is SECURITY CONFORMANCE TESTING of defined controls. Passing it is NOT equivalent to passing a vulnerability assessment and penetration test (VAPT) or a full cybersecurity assessment (TEC-14 only checks that an independent assessment exists). EXCEPTION HANDLING (TS3-01 to TS3-09): the EMR must not show a failed exchange as successful, must explain the error, allow correction, and leave exactly one correct referral on the SHR — inputs and expected results are in Test Data Section D (TD-D##).'
  note: 'Count criteria: mark each sub-item (rows marked ↳). Required, Achieved, Result and Outstanding are calculated automatically.'
  report_heading: LEVEL 2D — SECURITY, RELIABILITY & EXCEPTION HANDLING (conformance testing — not a VAPT)
