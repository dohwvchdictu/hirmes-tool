- key: L2A
  tab: L2-A TS0-Terminology
  title: Level 2A — TS0 Terminology & Registry Validation (GATE)
  intro: 'Before the EMR submits (TS1) or reads (TS2) an eReferral, every coded element MUST use the official terminology. Every registry value or patient identifier MUST follow the official registry. The Terminology & Registry Sources (Reference Guide, Ch. 4) name the exact server, registry or API for each concept (SRC-01 to SRC-15). The critical items MUST score 100%. They are the IG-required bindings (TS0-01, TS0-02) and invalid-code handling (TS0-03). They also include PSGC and NHFR (★ in TS0-06) and the PhilHealth / PhilSys identifiers (TS0-07). TS1, TS2 and Level 3 cannot work without them. Other items (display text, code-system validity, NHWR, DSWD) have normal weight but are not critical. The vendor MAY choose how to get the values (live look-up, scheduled sync or cached copy). Test this part first.'
  note: 'Count criteria: mark each sub-item (rows marked ↳). The tool calculates Required, Achieved, Result and Outstanding automatically.'
  report_heading: LEVEL 2A — TS0 TERMINOLOGY & REGISTRY VALIDATION (GATE)
