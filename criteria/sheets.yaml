- key: L2B
  tab: L2-B TS1-Submission
  title: Level 2B — TS1 eReferral Submission by Referring Facility
  intro: 'The referring facility submits the Test Data referral to the Shared Health Record (SHR). The Validator verifies every item on the server with any one form of server-side evidence. Accepted forms: an Interoperability Layer log (for example, OpenHIM), an Inferno / FHIR validator report, or the raw request / response payload from the developer. Fields are grouped by FHIR resource. Open the resource once and tick its fields. ★ marks critical sub-items. The vendor MAY choose how to send the data (HTTP verbs, bundle style).'
  note: 'Count criteria: mark each sub-item (rows marked ↳). The tool calculates Required, Achieved, Result and Outstanding automatically.'
  report_heading: LEVEL 2B — TS1 EREFERRAL SUBMISSION
