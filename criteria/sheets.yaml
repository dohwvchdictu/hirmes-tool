- key: L2B
  tab: L2-TS1 Submission
  title: Level 2B — TS1 eReferral Submission by Referring Facility
  intro: 'The referring facility submits the Test Data referral to the Shared Health Record (SHR). Every item is verified ON THE SERVER using any one form of server-side evidence: an Interoperability Layer log (e.g., OpenHIM), an Inferno / FHIR validator report, or the raw request / response payload from the developer. Fields are grouped by FHIR resource — open the resource once and tick its fields. ★ marks critical sub-items. How the data is sent (HTTP verbs, bundle style) is the vendor''s choice.'
  note: 'Count criteria: mark each sub-item (rows marked ↳). Required, Achieved, Result and Outstanding are calculated automatically.'
  report_heading: LEVEL 2B — TS1 EREFERRAL SUBMISSION
