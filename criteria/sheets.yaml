- key: L4
  tab: L4 Advanced
  title: Level 4 — Advanced Interoperability
  intro: 'Advanced interoperability. Rev 7 separates two tracks. Core-track items are fundamental interoperability requirements. They will migrate to Level 2 (minimum conformance) as soon as the PHeReF IG models them. (IG v0.1.0 does not yet model back-referral and the multi-tier referral chain.) Maturity items are capability targets that stay OPTIONAL. Moved to Level 2 in Rev 7: status timestamps (L4-06 → TS2-13), patient de-duplication (L4-08 → TS1-16) and NHFR-sourced facility data (L4-09 → TS0-06.2). The Section column shows the track.'
  note: 'Count criteria: mark each sub-item (rows marked ↳). The tool calculates Required, Achieved, Result and Outstanding automatically.'
  report_heading: LEVEL 4 — ADVANCED INTEROPERABILITY (Core-track / Maturity)
