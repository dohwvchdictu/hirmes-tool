- key: L4
  tab: L4 Advanced
  title: Level 4 — Advanced Interoperability
  intro: 'Advanced interoperability. Rev 7 separates two tracks: CORE-TRACK items are fundamental interoperability requirements that will MIGRATE to Level 2 (minimum conformance) as soon as the PHeReF IG models them (back-referral and the multi-tier referral chain are not yet modelled in IG v0.1.0); MATURITY items are capability targets that remain optional. Moved to Level 2 in Rev 7: status timestamps (L4-06 → TS2-13), patient de-duplication (L4-08 → TS1-16) and NHFR-sourced facility data (L4-09 → TS0-06.2). The track is shown in the Section column.'
  note: 'Count criteria: mark each sub-item (rows marked ↳). Required, Achieved, Result and Outstanding are calculated automatically.'
