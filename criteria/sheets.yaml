  tab: L2-TS2 Retrieval
  title: Level 2C — TS2 eReferral Retrieval and Status Update by Receiving Facility
  intro: The receiving facility retrieves the referral from the SHR, displays it, and updates the referral status. Compare every value with the Test Data sheet and confirm with server-side evidence (IOL log, Inferno / validator report, or raw payload). Fields are grouped by screen area / FHIR resource. ★ marks critical sub-items. Screen layout is the vendor's choice.
