- key: L2A
  tab: L2-TS0 Terminology
  title: Level 2A — TS0 Terminology & Registry Validation (GATE)
  intro: 'Before submitting (TS1) or reading (TS2) an eReferral, every coded element must use the official terminology and every registry value or patient identifier must follow the official registry — the exact server, registry or API for each concept is named in the Terminology & Registry Sources (Reference Guide, Ch. 4) (SRC-01 to SRC-15). CRITICAL (must be 100%): the IG-required bindings (TS0-01, TS0-02), invalid-code handling (TS0-03), PSGC and NHFR (★ in TS0-06) and the PhilHealth / PhilSys identifiers (TS0-07) — TS1, TS2 and Level 3 cannot work without them. Other items (display text, code-system validity, NHWR, DSWD) carry normal weight but are not critical. How values are obtained (live look-up, scheduled sync or cached copy) is the vendor''s choice. Test this part FIRST.'
  note: 'Count criteria: mark each sub-item (rows marked ↳). Required, Achieved, Result and Outstanding are calculated automatically.'
  report_heading: LEVEL 2A — TS0 TERMINOLOGY & REGISTRY VALIDATION (GATE)
