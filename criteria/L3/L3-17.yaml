developer_guide: |
  Assign each referral to a period by the date/time referred (ServiceRequest.authoredOn) in Philippine Standard Time, as defined in IND-01.

  Purpose: Monthly reports must not move referrals between months.
validator_guide: |
  Retrieve the Section C referrals C1–C6 that the DOH pre-loaded on the SHR with fixed timestamps (Test Data Section C). Filter the linelist / counts by the Section C reporting month and by the following month. Compare with the Section C Expected Results. Calculation rule: IND-01 (Reference Guide, Ch. 6).
  Mark each sub-item (↳) below; Achieved is counted automatically.
