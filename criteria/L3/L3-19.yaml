id: L3-19
status: active
section: Edge cases
title: Late status changes are reflected when the report is re-run, and turnaround time uses the correct timestamps (IND-04, IND-08)
critical: 'no'
weight: 1
scoring: count
validation_role: Validator
evidence: Report screenshots before and after + Test Data Section C
developer_guide: |
  Report the status as of the time the report is run (IND-04). Compute TAT from the first 'received' timestamp, not from later updates (IND-08).

  Purpose: Reports MUST follow reality as referrals progress, not freeze at the first status.
validator_guide: |
  1. Run the report.
  2. Change C5 from accepted to completed. Change C2 from received to rejected.
  3. Run the report again. Compare the result with the Expected Results (after-update column).
  Mark each sub-item (↳) below. The tool counts Achieved automatically.
sub_items:
- id: L3-19.1
  text: Re-run shows the new status counts after the late updates
  critical: false
- id: L3-19.2
  text: TAT of C2 unchanged by the later status update (uses first 'received')
  critical: false
- id: L3-19.3
  text: Completed count includes C5 after the update
  critical: false
