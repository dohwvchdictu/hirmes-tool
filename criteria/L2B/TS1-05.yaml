id: TS1-05
status: active
section: Accompanying person
title: Accompanied By / Next of Kin is submitted correctly
critical: 'no'
weight: 1
scoring: binary
validation_role: Validator + server-side check + Observer
evidence: Server-side evidence (IOL log, Inferno / validator report, or raw payload) + resource ID
developer_guide: |
  Send the accompanying person / next of kin (name, relationship, contact number) as a RelatedPerson (ERefRelatedPerson), in accordance with the IG. While the IG is in draft, the vendor MAY use Patient.contact as an equivalent, if the values are complete and pass $validate. The vendor MAY use any create / update method. A transaction Bundle is RECOMMENDED. The vendor MAY use conditional create / update. This criterion does not prescribe HTTP verbs. The test checks that the values reach the SHR in the profiled resource and that they can be retrieved.

  Purpose: The receiving facility knows who is with the patient and whom to contact.
validator_guide: |
  1. Enter the Test Data value.
  2. Submit the referral.
  3. In the server-side evidence, find the RelatedPerson (or Patient.contact).
  4. Compare name, relationship and contact number with the Test Data.
  Met only if all three match.
  Server-side evidence is any one of these items:
  (a) The Interoperability Layer transaction log (for example, OpenHIM).
  (b) An Inferno / official FHIR validator report.
  (c) The raw FHIR request / response payload that the developer provides and that is captured during the session.
