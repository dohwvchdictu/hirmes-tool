id: TS1-06
status: active
section: Referral request
title: Referral request details are submitted correctly
critical: subs
weight: 2
scoring: count
validation_role: Validator + server-side check + Observer
evidence: Server-side evidence (IOL log, Inferno / validator report, or raw payload) + resource ID
developer_guide: |
  Capture the fields below in the EMR. Send them in the ServiceRequest (EReferral ServiceRequest), in accordance with the PHeReF / PH Core profile. The vendor MAY use any create / update method. A transaction Bundle is RECOMMENDED. The vendor MAY use conditional create / update. This criterion does not prescribe HTTP verbs. The test checks that the values reach the SHR in the profiled resource and that they can be retrieved.
  FHIR elements: ServiceRequest.authoredOn, .category (Referral Category VS), .priority (EReferralPriority), .reasonCode (Reason for Referral VS) with .reasonReference → Condition. Links: .subject → Patient, .requester → referring PractitionerRole, .performer → receiving facility / practitioner. Also .intent = order (fixed) and .status.
  Source: SRC-02, SRC-03, SRC-09 (Reference Guide, Ch. 4: Terminology & Registry Sources)

  Purpose: The receiving facility sees what is requested, how urgent it is and why.
validator_guide: |
  1. Enter the Test Data values for this group (Test Data Section A) in the referring EMR.
  2. Submit the referral.
  3. Open the ServiceRequest in the server-side evidence.
  4. Compare each sub-item with the Test Data value.
  5. Record the resource ID / log reference in Notes.
  Mark each sub-item (↳) below. The tool counts Achieved automatically. ★ = critical sub-item. If a ★ sub-item is Not Met (or N/A), the criterion counts as a critical failure.
  Server-side evidence is any one of these items:
  (a) The Interoperability Layer transaction log (for example, OpenHIM).
  (b) An Inferno / official FHIR validator report.
  (c) The raw FHIR request / response payload that the developer provides and that is captured during the session.
sub_items:
- id: TS1-06.1
  text: 'Date of referral: ServiceRequest.authoredOn'
  critical: false
- id: TS1-06.2
  text: 'Referral category: ServiceRequest.category (Emergency / Outpatient)'
  critical: true
- id: TS1-06.3
  text: 'Priority: ServiceRequest.priority (routine / urgent / stat)'
  critical: true
- id: TS1-06.4
  text: 'Reason for referral: ServiceRequest.reasonCode'
  critical: true
- id: TS1-06.5
  text: 'Links: subject → Patient, requester → referring PractitionerRole, performer → receiving facility'
  critical: true
- id: TS1-06.6
  text: 'Fixed values: intent = order, status as the IG specifies'
  critical: false
