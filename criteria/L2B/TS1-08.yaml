id: TS1-08
status: active
section: Vital signs
title: Vital signs are submitted correctly (LOINC code, category vital-signs, value with UCUM unit)
critical: subs
weight: 2
scoring: count
validation_role: Validator + server-side check + Observer
evidence: Server-side evidence (IOL log, Inferno / validator report, or raw payload) + resource ID
developer_guide: |
  Capture the fields below in the EMR and send them in the Observation (EReferral Observation) per the PHeReF / PH Core profile. Any create / update method is accepted (transaction Bundle recommended; conditional create / update allowed) — HTTP verbs are not prescribed. What is tested is that the values reach the SHR in the profiled resource and can be retrieved.
  FHIR elements: Observation.code (LOINC), Observation.category = vital-signs, Observation.value[x] with UCUM unit; blood pressure as panel 85354-9 with systolic (8480-6) and diastolic (8462-4) components.
  Source: SRC-07 (Terminology & Registry Sources — Reference Guide, Ch. 4)

  Purpose: Vital signs are machine-readable and comparable at the receiving facility.
validator_guide: |
  1. Enter the Test Data values for this group (Test Data Section A) in the referring EMR and submit the referral.
  2. Open the Observation in the server-side evidence and compare each sub-item with the Test Data value.
  3. Record the resource ID / log reference in Notes.
  Mark each sub-item (↳) below; Achieved is counted automatically. ★ = critical sub-item: if it is Not Met (or N/A) the criterion counts as a critical failure.
  Server-side evidence — any ONE of: (a) Interoperability Layer transaction log (e.g., OpenHIM), (b) Inferno / official FHIR validator report, or (c) the raw FHIR request / response payload provided by the developer and captured during the session.
