id: TS1-08
status: active
section: Vital signs
title: Vital signs are submitted correctly (LOINC code, category vital-signs, value with UCUM unit)
critical: subs
weight: 2
scoring: count
validation_role: Validator + server-side check + Observer
evidence: Server-side evidence (IOL log, Inferno / validator report, or raw payload) + resource ID
developer_guide: |
  Capture the fields below in the EMR. Send them in the Observation (EReferral Observation), in accordance with the PHeReF / PH Core profile. The vendor MAY use any create / update method. A transaction Bundle is RECOMMENDED. The vendor MAY use conditional create / update. This criterion does not prescribe HTTP verbs. The test checks that the values reach the SHR in the profiled resource and that they can be retrieved.
  FHIR elements: Observation.code (LOINC), Observation.category = vital-signs, Observation.value[x] with UCUM unit. Blood pressure: panel 85354-9 with systolic (8480-6) and diastolic (8462-4) components.
  Source: SRC-07 (Reference Guide, Ch. 4: Terminology & Registry Sources)

  Purpose: Vital signs are machine-readable and comparable at the receiving facility.
validator_guide: |
  1. Enter the Test Data values for this group (Test Data Section A) in the referring EMR.
  2. Submit the referral.
  3. Open the Observation in the server-side evidence.
  4. Compare each sub-item with the Test Data value.
  5. Record the resource ID / log reference in Notes.
  Mark each sub-item (↳) below. The tool counts Achieved automatically. ★ = critical sub-item. If a ★ sub-item is Not Met (or N/A), the criterion counts as a critical failure.
  Server-side evidence is any one of these items:
  (a) The Interoperability Layer transaction log (for example, OpenHIM).
  (b) An Inferno / official FHIR validator report.
  (c) The raw FHIR request / response payload that the developer provides and that is captured during the session.
