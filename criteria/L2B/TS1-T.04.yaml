id: TS1-T.04
status: active
section: Transaction
title: 'Onward referral: when the receiving facility refers the patient onward, the chain is kept and the prior referral is closed'
critical: 'no'
weight: 1
scoring: binary
validation_role: Validator (server-side check)
evidence: Server-side evidence for both ServiceRequests
developer_guide: |
  For an onward referral, do these three steps:
  1. Set the Task outcome to referred-onward.
  2. Create a new ServiceRequest that references the previous one (ServiceRequest.replaces, in accordance with the IG).
  3. Update the status of the previous ServiceRequest.

  Purpose: This prevents a patient from appearing as referred to two places at the same time.
validator_guide: |
  Do one onward referral. Met if the server-side evidence shows these three items:
  (1) Task = referred-onward.
  (2) The new ServiceRequest references the earlier one.
  (3) The status of the earlier ServiceRequest changed.
  Server-side evidence is any one of these items:
  (a) The Interoperability Layer transaction log (for example, OpenHIM).
  (b) An Inferno / official FHIR validator report.
  (c) The raw FHIR request / response payload that the developer provides and that is captured during the session.
