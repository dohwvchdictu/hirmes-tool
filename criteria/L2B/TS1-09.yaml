id: TS1-09
status: active
section: Attachments
title: Laboratory result attachment is submitted with the referral
critical: 'no'
weight: 1
scoring: binary
validation_role: Validator + server-side check + Observer
evidence: Server-side evidence (IOL log, Inferno / validator report, or raw payload) + resource ID
developer_guide: |
  Send laboratory results as DiagnosticReport.presentedForm (Attachment with contentType and data or url). The vendor MAY use any create / update method. A transaction Bundle is RECOMMENDED. The vendor MAY use conditional create / update. This criterion does not prescribe HTTP verbs. The test checks that the values reach the SHR in the profiled resource and that they can be retrieved.

  Purpose: Lab results travel with the patient.
validator_guide: |
  Attach the Test Data lab file. Submit the referral. Met if the server-side evidence shows a DiagnosticReport whose presentedForm contains the file with a contentType.
  Server-side evidence is any one of these items:
  (a) The Interoperability Layer transaction log (for example, OpenHIM).
  (b) An Inferno / official FHIR validator report.
  (c) The raw FHIR request / response payload that the developer provides and that is captured during the session.
