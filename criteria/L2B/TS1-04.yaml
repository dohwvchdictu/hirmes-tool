id: TS1-04
status: active
section: Patient
title: Patient demographics and identifiers are submitted correctly
critical: subs
weight: 2
scoring: count
validation_role: Validator + server-side check + Observer
evidence: Server-side evidence (IOL log, Inferno / validator report, or raw payload) + resource ID
developer_guide: |
  Capture the fields below in the EMR. Send them in the Patient (ERefPatient / PH Core Patient), in accordance with the PHeReF / PH Core profile. The vendor MAY use any create / update method. A transaction Bundle is RECOMMENDED. The vendor MAY use conditional create / update. This criterion does not prescribe HTTP verbs. The test checks that the values reach the SHR in the profiled resource and that they can be retrieved.
  FHIR elements: Patient.name, Patient.identifier (PH Core PhilSys and PhilHealth slices), Patient.birthDate, Patient.gender. Also Patient.maritalStatus, Patient.address (PSGC-coded), Patient.telecom, PWD Disability Registration extension. The EMR does not send age. The receiving system computes it from birthDate (checked in TS2-04).
  Source: SRC-05, SRC-10, SRC-13, SRC-14 (Reference Guide, Ch. 4: Terminology & Registry Sources)

  Purpose: The patient is identified unambiguously across facilities.
validator_guide: |
  1. Enter the Test Data values for this group (Test Data Section A) in the referring EMR.
  2. Submit the referral.
  3. Open the Patient in the server-side evidence.
  4. Compare each sub-item with the Test Data value.
  5. Record the resource ID / log reference in Notes.
  Mark each sub-item (↳) below. The tool counts Achieved automatically. ★ = critical sub-item. If a ★ sub-item is Not Met (or N/A), the criterion counts as a critical failure.
  Server-side evidence is any one of these items:
  (a) The Interoperability Layer transaction log (for example, OpenHIM).
  (b) An Inferno / official FHIR validator report.
  (c) The raw FHIR request / response payload that the developer provides and that is captured during the session.
