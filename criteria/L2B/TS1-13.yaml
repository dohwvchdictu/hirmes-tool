id: TS1-13
status: active
section: Encounter
title: The referral is linked to the encounter at the referring facility
critical: 'no'
weight: 1
scoring: binary
validation_role: Validator + server-side check + Observer
evidence: Server-side evidence (IOL log, Inferno / validator report, or raw payload) + resource ID
developer_guide: |
  Send the referring-facility encounter as an Encounter (ERefEncounter) and reference it from ServiceRequest.encounter. Any create / update method is accepted (transaction Bundle recommended; conditional create / update allowed) — HTTP verbs are not prescribed. What is tested is that the values reach the SHR in the profiled resource and can be retrieved.

  Purpose: Places the referral in the context of the visit where it was made.
validator_guide: |
  Met if the server-side evidence shows an Encounter for the test patient, referenced by ServiceRequest.encounter.
  Server-side evidence — any ONE of: (a) Interoperability Layer transaction log (e.g., OpenHIM), (b) Inferno / official FHIR validator report, or (c) the raw FHIR request / response payload provided by the developer and captured during the session.
traces:
