id: TS1-13
status: active
section: Encounter
title: The referral is linked to the encounter at the referring facility
critical: 'no'
weight: 1
scoring: binary
validation_role: Validator + server-side check + Observer
evidence: Server-side evidence (IOL log, Inferno / validator report, or raw payload) + resource ID
developer_guide: |
  Send the encounter at the referring facility as an Encounter (ERefEncounter). Reference it from ServiceRequest.encounter. The vendor MAY use any create / update method. A transaction Bundle is RECOMMENDED. The vendor MAY use conditional create / update. This criterion does not prescribe HTTP verbs. The test checks that the values reach the SHR in the profiled resource and that they can be retrieved.

  Purpose: The Encounter puts the referral in the context of the visit where the referral was made.
validator_guide: |
  Met if the server-side evidence shows an Encounter for the test patient, referenced by ServiceRequest.encounter.
  Server-side evidence is any one of these items:
  (a) The Interoperability Layer transaction log (for example, OpenHIM).
  (b) An Inferno / official FHIR validator report.
  (c) The raw FHIR request / response payload that the developer provides and that is captured during the session.
traces:
  fhir_traceability:
  - TR-042
