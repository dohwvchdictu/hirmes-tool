id: TS1-16
status: active
section: Patient matching
title: 'Submitting a referral for an existing patient reuses the existing Patient record — no duplicate patient is created (moved from L4-08; Connectathon Issue #8)'
critical: 'yes'
weight: 2
scoring: count
validation_role: Validator (server-side check)
evidence: SHR Patient search result + server-side evidence
developer_guide: |
  Match the patient on the SHR by the PH Core PhilSys / PhilHealth identifiers (validated in TS0-07) before creating one — e.g., conditional update 'PUT Patient?identifier=…' as in the IG example transaction (ExampleERefSubmissionBundle), or search then reuse. The matching method is the vendor's choice.

  Purpose: One patient = one record across the network; duplicates split the clinical history.
validator_guide: |
  Submit 3 referrals for the same test patient (Test Data Section A identifiers). Validator (server-side) searches Patient by identifier and counts the referrals linked to the single existing Patient.
  Mark each sub-item (↳) below; Achieved is counted automatically. ★ = critical sub-item: if it is Not Met (or N/A) the criterion counts as a critical failure.
  Server-side evidence — any ONE of: (a) Interoperability Layer transaction log (e.g., OpenHIM), (b) Inferno / official FHIR validator report, or (c) the raw FHIR request / response payload provided by the developer and captured during the session.
