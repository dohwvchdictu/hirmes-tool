id: TS1-02
status: active
section: Receiving facility
title: Receiving facility details are submitted correctly
critical: subs
weight: 2
scoring: count
validation_role: Validator + server-side check + Observer
evidence: Server-side evidence (IOL log, Inferno / validator report, or raw payload) + resource ID
developer_guide: |
  Capture the fields below in the EMR. Send them in the Organization (receiving facility), in accordance with the PHeReF / PH Core profile. The vendor MAY use any create / update method. A transaction Bundle is RECOMMENDED. The vendor MAY use conditional create / update. This criterion does not prescribe HTTP verbs. The test checks that the values reach the SHR in the profiled resource and that they can be retrieved.
  FHIR elements: Organization.name, Organization.identifier (NHFR), Organization.address. The Organization is referenced from ServiceRequest.performer / Task.owner.
  Source: SRC-10, SRC-11 (Reference Guide, Ch. 4: Terminology & Registry Sources)

  Purpose: The referral is addressed to the correct facility, so it appears in the incoming list of that facility.
validator_guide: |
  1. Enter the Test Data values for this group (Test Data Section A) in the referring EMR.
  2. Submit the referral.
  3. Open the Organization in the server-side evidence.
  4. Compare each sub-item with the Test Data value.
  5. Record the resource ID / log reference in Notes.
  Mark each sub-item (↳) below. The tool counts Achieved automatically. ★ = critical sub-item. If a ★ sub-item is Not Met (or N/A), the criterion counts as a critical failure.
  Server-side evidence is any one of these items:
  (a) The Interoperability Layer transaction log (for example, OpenHIM).
  (b) An Inferno / official FHIR validator report.
  (c) The raw FHIR request / response payload that the developer provides and that is captured during the session.
sub_items:
- id: TS1-02.1
  text: 'Facility name: Organization.name'
  critical: false
- id: TS1-02.2
  text: 'NHFR code: Organization.identifier (NHFR)'
  critical: true
- id: TS1-02.3
  text: 'Address, PSGC-coded: Organization.address'
  critical: false
