title: Technical Baseline (TB-)
source: Technical Reference Guide (legacy Rev 9)
entries:
- ref: TB-01
  area: Encryption in transit — protocol & certificate
  minimum_baseline: TLS 1.2 or higher on every endpoint used for the eReferral (TLS 1.3 recommended). HTTPS only — plain HTTP disabled or redirected to HTTPS. Valid certificate from a trusted certificate authority (or the CA designated by the DOH for the sandbox), unexpired, host name matching.
  type: Fixed standard
  acceptable_examples: Any web server or reverse proxy, API gateway, load balancer or cloud TLS termination; public or commercial certificates.
  not_acceptable: SSL 2.0 / 3.0, TLS 1.0 / 1.1; plain HTTP; expired, mismatched or self-signed certificates on endpoints used for exchange.
  how_the_validators_verify: TLS scan of each endpoint (e.g., testssl.sh, nmap ssl-enum-ciphers, online TLS checker) — TEC-01.
  related_criteria: L1-05.3, TEC-01
  reference: NPC Circular 2023-06 §11, §16 (secure encrypted links); NIST SP 800-52 Rev. 2; RFC 8446 (TLS 1.3)
- ref: TB-02
  area: Encryption in transit — cipher suites & keys
  minimum_baseline: Forward-secret key exchange (ECDHE, or DHE ≥ 2048-bit) with authenticated encryption (AES-GCM or ChaCha20-Poly1305). Certificate keys RSA ≥ 2048-bit or ECDSA ≥ P-256.
  type: Fixed standard
  acceptable_examples: The "modern" or "intermediate" TLS configuration profiles of current servers and cloud services.
  not_acceptable: RC4, DES, 3DES, NULL, EXPORT or anonymous cipher suites; RSA keys < 2048-bit; MD5- or SHA-1-signed certificates.
  how_the_validators_verify: Same TLS scan as TB-01 — TEC-01.
  related_criteria: TEC-01
  reference: NIST SP 800-52 Rev. 2
- ref: TB-03
  area: Encryption at rest
  minimum_baseline: Personal and health data held by the system — database, stored files / attachments and backups — encrypted with AES-128 or stronger (AES-256 recommended). Encryption keys stored separately from the encrypted data and never hard-coded in source code. Exports containing personal data (e.g., CSV / Excel, L3-14) can be protected (encrypted or password-protected archive) when they must leave the system on removable media.
  type: Fixed standard
  acceptable_examples: Full-disk / volume encryption (e.g., BitLocker, LUKS, cloud volume encryption); database transparent data encryption; file- or field-level encryption; encrypted backup tools. Keys in a key management service, HSM, OS key store or secrets vault.
  not_acceptable: Unencrypted database or backup files; keys stored with the data or in source code; home-made or proprietary ciphers.
  how_the_validators_verify: 'Any one accepted evidence option (Instructions 4B): view-only demonstration, configuration screenshot with keys masked, cloud-provider / independent certification, or signed attestation — TEC-08.'
  related_criteria: L1-05.3, TEC-07, TEC-08, L3-14
  reference: RA 10173 §20; NPC Circular 2023-06 §11 and §25 (files on removable / portable media must be encrypted); NIST SP 800-111
- ref: TB-04
  area: Password storage
  minimum_baseline: 'Passwords stored only as salted hashes using an adaptive algorithm: Argon2id, bcrypt, scrypt, or PBKDF2 with a work factor per current OWASP guidance.'
  type: Fixed standard
  acceptable_examples: Framework password hashers configured with one of these algorithms; or authentication delegated to an external identity provider that meets this baseline.
  not_acceptable: Plain text; reversible encryption; unsalted or fast hashes (MD5, SHA-1, single-pass SHA-256).
  how_the_validators_verify: Stored form of one TEST password shown view-only, or a signed attestation naming the algorithm with the framework configuration — TEC-08.
  related_criteria: L1-05.3, TEC-08
  reference: NPC Circular 2023-06 §11 (password strength, password policy); OWASP Password Storage Cheat Sheet; NIST SP 800-63B
- ref: TB-05
  area: User authentication
  minimum_baseline: One account per user. Minimum password length 8 characters (12 or more recommended). Lock-out or throttling after no more than 10 consecutive failed log-in attempts. Default / vendor passwords must be changed at installation. Online access to patient data (sensitive personal information) uses a secure authentication mechanism — multi-factor authentication, or log-in only over encrypted links (TB-01) — and user rights are managed in the system's user-management tool. Multi-factor authentication recommended for administrator and remote access.
  type: 'Fixed standard (lock-out count: DOH policy default)'
  acceptable_examples: Local accounts, LDAP / Active Directory, single sign-on, OpenID Connect; authenticator apps or SMS / e-mail OTP for MFA.
  not_acceptable: Shared or generic accounts; default passwords left unchanged; unlimited log-in attempts.
  how_the_validators_verify: TEC-02 tests (short password, repeated failed log-ins, account list).
  related_criteria: L1-05.1, TEC-02, TEC-03
  reference: NPC Circular 2023-06 §11, §13 (access control, need-to-know), §16 (secure authentication, system management tool); NIST SP 800-63B
- ref: TB-06
  area: Session time-out
  minimum_baseline: 'Idle sessions are logged out or locked (re-authentication required) after a period the facility can configure. Default: not more than 15 minutes.'
  type: DOH policy default (15 min)
  acceptable_examples: Application session time-out, OS screen lock integrated with the application, SSO session policy.
  not_acceptable: No time-out; time-out that cannot be configured; default above the DOH value.
  how_the_validators_verify: TEC-05 idle test.
  related_criteria: L1-05.1, TEC-05
  reference: DOH policy setting; NPC Circular 2023-06 §13
- ref: TB-07
  area: System-to-system authentication (EMR ↔ SHR / terminology server)
  minimum_baseline: Use the authentication method issued by the HIE / SHR operator (DOH). Credentials and tokens are kept on the server side, never exposed in browser or mobile-app code, and sent only over TLS (TB-01).
  type: Fixed standard (method set by the SHR operator)
  acceptable_examples: OAuth 2.0 client credentials / SMART Backend Services, mutual TLS, or API keys — whichever the SHR operator issues.
  not_acceptable: Credentials embedded in client-side JavaScript or mobile apps; one credential shared by several facilities or vendors.
  how_the_validators_verify: Validator reviews the connection set-up during TS1 / TS2 and records it in the Notes of TS1-T.01.
  related_criteria: L1-05.1, TS1-T.01, TS0-07
  reference: SHR / HIE connection guide (DOH); NPC Circular 2023-06 §20 (data sharing) when external registries / APIs (PSA, DSWD, PhilHealth) receive personal data
- ref: TB-08
  area: Audit log content
  minimum_baseline: 'Each entry records: user ID, date and time (Philippine Standard Time, or UTC with offset, from a synchronised clock such as NTP), action, patient / record affected, and source (workstation or IP). Entries cannot be edited or deleted by ordinary users. Authentication attempts and security events are logged and kept LONGER than general system logs; logs are backed up and archived (TB-09). Retention per the facility''s policy, and longer when an incident is under investigation.'
  type: Fixed standard
  acceptable_examples: Database audit table, append-only log files, FHIR AuditEvent, central log server / SIEM.
  not_acceptable: Logs editable by end users; entries without user or time; logging that can be switched off by end users.
  how_the_validators_verify: TEC-04 action test (10 actions).
  related_criteria: L1-05.2, TEC-04
  reference: NPC Circular 2023-06 §29 (logs retention); RA 10173 §20
- ref: TB-09
  area: Backup & recovery of system-only data
  minimum_baseline: Automated backup of data held only in the system (user accounts / credentials, roles, audit trail, configuration) at least daily; backups encrypted (TB-03) and stored separately from the production system; restore demonstrated and the expected restoration time documented.
  type: DOH policy default (daily)
  acceptable_examples: Database dumps or snapshots, cloud backup services, off-site or second-site copies.
  not_acceptable: Backups only on the same disk / server; unencrypted backups; restore never tested.
  how_the_validators_verify: 'TEC-07: restore demonstration, dated restore-test record, or provider backup report + signed attestation.'
  related_criteria: L1-05.4, TEC-07
  reference: 'NPC Circular 2023-06 §21 (business continuity: backup, restoration and remedial time); RA 10173 §20'
- ref: TB-10
  area: FHIR & data format
  minimum_baseline: HL7 FHIR R4 (4.0.1); JSON (application/fhir+json), XML only if the SHR also accepts it; UTF-8; dates / date-times in ISO 8601 with time zone where the IG requires dateTime; the PH Core and PHeReF IG versions announced by the DOH for the test cycle.
  type: Fixed standard (IG versions announced by DOH)
  acceptable_examples: Any FHIR library, server or platform (open-source or commercial) or a custom implementation.
  not_acceptable: Proprietary formats in place of FHIR; resources that fail $validate.
  how_the_validators_verify: TS1-T.02 ($validate = 0 errors) and TS1-T.03 (meta.profile).
  related_criteria: L1-03, TS1-T.02, TS1-T.03
  reference: HL7 FHIR R4; PH Core IG; PHeReF IG
- ref: TB-11
  area: Privacy-by-design & privacy-by-default
  minimum_baseline: By default only the data needed for the referral is collected and shown; functions without a lawful basis can be switched off; dashboards show de-identified, aggregated data (L3-11); the database is reachable only through the application and authorised administration tools (no shared database log-ins for users); the system supports configurable retention periods and secure deletion or anonymisation at the end of retention.
  type: 'Fixed standard (retention periods: facility policy)'
  acceptable_examples: Role-based views and field visibility, configurable optional fields, scheduled purge / anonymisation jobs, documented disposal procedure.
  not_acceptable: Hidden or unnecessary data collection switched on by default; no way to delete or anonymise records at end of retention; end users given direct database access.
  how_the_validators_verify: L1-05.5 documentation; L3-11 dashboard test; TEC-03 role test.
  related_criteria: L1-05.5, L3-11, TEC-03
  reference: NPC Circular 2023-06 §7 and §8 (privacy-by-design / by-default, privacy engineering), §9 (retention), §12 (database access via authorised programs), §28–30 (disposal)
- ref: TB-12
  area: Account revocation & session invalidation
  minimum_baseline: Log-out invalidates the session on the server. Expired sessions / tokens are refused. A deactivated account cannot start a new session immediately, and its active sessions end within 15 minutes (DOH policy default). Access tokens for users expire within the idle time-out (TB-06) or are refreshed only while the user is active.
  type: 'Fixed standard (revocation window: DOH policy default 15 min)'
  acceptable_examples: Server-side session store, short-lived tokens with server-side revocation list, SSO / identity-provider session policies.
  not_acceptable: Log-out that only clears the browser; tokens that remain valid for days; deactivated users who keep working until their session ends naturally.
  how_the_validators_verify: TEC-10 black-box test (log-out replay, expiry, deactivation).
  related_criteria: TEC-10
  reference: NPC Circular 2023-06 §13; OWASP ASVS V3 (Session Management)
- ref: TB-13
  area: Error handling & logging hygiene
  minimum_baseline: Users see generic error messages (no stack traces, SQL, file paths, server or library versions). Secrets (passwords, tokens, keys) are never written to messages or logs. Application / debug logs exclude full patient identifiers and clinical content unless required for the TB-08 audit log; debug logging is off in production.
  type: Fixed standard
  acceptable_examples: Framework production error pages, structured logging with field masking, log redaction filters.
  not_acceptable: Stack traces or SQL shown to users; tokens in URLs or logs; full PhilHealth / PhilSys numbers in debug logs.
  how_the_validators_verify: TEC-11 (error messages, client-side inspection, log sample or signed attestation); TS3-08.
  related_criteria: TEC-11, TS3-08
  reference: RA 10173 §20; NPC Circular 2023-06 §12–13; OWASP ASVS V7
- ref: TB-14
  area: Vulnerability management
  minimum_baseline: A vulnerability assessment and penetration test (VAPT) or an authenticated vulnerability scan of the product version (same major version) at least every 12 months and after each major release, by an independent party or a security team separate from the developers. Critical / high findings fixed before go-live or covered by a dated remediation plan accepted by the Technical Lead. Security patches for critical vulnerabilities in components applied within 30 days (DOH policy default).
  type: DOH policy default (12 months; 30 days)
  acceptable_examples: Third-party VAPT firm, DICT / government CERT assessment, recognised scanning tools with authenticated scans, bug-bounty reports.
  not_acceptable: No assessment; assessment of a different product; open critical / high findings without a plan; scans older than 12 months.
  how_the_validators_verify: TEC-14 document check (date, scope, independence, finding status).
  related_criteria: TEC-14
  reference: NPC Circular 2023-06 §13 (regular testing); ISO/IEC 27001 A.8.8
